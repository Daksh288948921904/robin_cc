# ============================================================
# Nginx reverse proxy — robin cc
# Place at: /etc/nginx/sites-available/robin-cc
# Enable:   ln -s /etc/nginx/sites-available/robin-cc /etc/nginx/sites-enabled/
# ============================================================
# Replace YOUR_DOMAIN with your actual domain (e.g. news.example.com)
# or use the server's IP address for testing.
# ============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=scrape:10m rate=2r/m;

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Redirect all HTTP → HTTPS (uncomment after SSL is set up)
    # return 301 https://$host$request_uri;

    # ── Logging ──────────────────────────────────────────────
    access_log /var/log/nginx/robin-cc.access.log;
    error_log  /var/log/nginx/robin-cc.error.log warn;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Static files served directly by nginx (fast, no Python) ─
    location /static/ {
        alias /var/www/robin-cc/src/frontend/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;

        # AI-generated images — shorter cache (they're new each time)
        location /static/ai_images/ {
            alias /var/www/robin-cc/src/frontend/static/ai_images/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # ── Scrape endpoint — strict rate limit ──────────────────
    location /api/scrape {
        limit_req zone=scrape burst=2 nodelay;
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # scrape can take ~30 s
        proxy_connect_timeout 10s;
    }

    # ── AI image + social + summary endpoints — moderate limit ─
    location ~ ^/api/articles/[0-9]+/(image|social|summary|timeline) {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # image gen / social scrape ~2 min
        proxy_connect_timeout 10s;
        proxy_buffering    off;
    }

    # ── All other requests → gunicorn ────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Allow large downloads (.docx export)
        proxy_max_temp_file_size 0;
        client_max_body_size 10M;
    }
}

# ============================================================
